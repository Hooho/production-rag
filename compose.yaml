services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  # 数据库迁移：先把 MySQL 表结构升级到代码需要的版本，执行完就退出。
  # 原来由 API 和 Worker 启动时各自 create_all 并补列，两个容器同时启动可能同时改表；
  # 现在只在这里执行一次，API 和 Worker 等它成功结束后才启动。
  migrate:
    build:
      context: .
      # 只有下载 NLTK 资源（GitHub）这一步走 .env 里的代理；apt、pip 仍然直连，和原来一样。
      # 原来把 HTTP_PROXY 整个传给构建，apt 也改走代理，下载 Debian 包失败（apt-get 返回 100）。
      args:
        NLTK_PROXY: ${HTTPS_PROXY:-}
        NLTK_DATA_BASE_URL: ${NLTK_DATA_BASE_URL:-https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages}
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: rag
      MYSQL_USER: rag
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: .
      # 只有下载 NLTK 资源（GitHub）这一步走 .env 里的代理；apt、pip 仍然直连，和原来一样。
      # 原来把 HTTP_PROXY 整个传给构建，apt 也改走代理，下载 Debian 包失败（apt-get 返回 100）。
      args:
        NLTK_PROXY: ${HTTPS_PROXY:-}
        NLTK_DATA_BASE_URL: ${NLTK_DATA_BASE_URL:-https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages}
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: rag
      MYSQL_USER: rag
      # 登录令牌签名密钥，没填时启动直接报错，避免用空密钥签发令牌。
      JWT_SECRET: ${JWT_SECRET:?请填写 .env}
      LANGGRAPH_DATABASE_URL: postgresql://langgraph:${LANGGRAPH_POSTGRES_PASSWORD:?请填写 .env}@langgraph-postgres:5432/langgraph
      REDIS_HOST: redis
      MILVUS_URI: http://milvus:19530
      UPLOAD_DIR: /app/uploads
      EMBEDDING_MODE: ${EMBEDDING_MODE:-demo}
      EMBEDDING_URL: http://embedding:8090/v1
      RERANK_URL: http://embedding:8090/v1
      INTENT_URL: http://intent:8091/v1
      # 注入检测模型服务（输入安全检查第三层）；去掉这一行就不调用，这一层跳过。
      GUARD_URL: http://guard:8092
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-mysql,redis,milvus,embedding,intent,guard,localhost,127.0.0.1}
      # 评测结果文件名里的提交号；容器里没有 .git，启动时用 GIT_COMMIT=$(git rev-parse --short HEAD) 传入。
      GIT_COMMIT: ${GIT_COMMIT:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      langgraph-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      embedding:
        condition: service_healthy
      intent:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
      # 评测语料和初始题目（eval/seed）直接挂载仓库目录，改了不用重新构建镜像；题目和评测结果存在数据库里。
      - ./eval:/app/eval
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=20)"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 30s
  worker:
    build:
      context: .
      # 只有下载 NLTK 资源（GitHub）这一步走 .env 里的代理；apt、pip 仍然直连，和原来一样。
      # 原来把 HTTP_PROXY 整个传给构建，apt 也改走代理，下载 Debian 包失败（apt-get 返回 100）。
      args:
        NLTK_PROXY: ${HTTPS_PROXY:-}
        NLTK_DATA_BASE_URL: ${NLTK_DATA_BASE_URL:-https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages}
    command: ["python", "-m", "scripts.worker"]
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: rag
      MYSQL_USER: rag
      REDIS_HOST: redis
      MILVUS_URI: http://milvus:19530
      UPLOAD_DIR: /app/uploads
      EMBEDDING_MODE: ${EMBEDDING_MODE:-demo}
      EMBEDDING_URL: http://embedding:8090/v1
      RERANK_URL: http://embedding:8090/v1
      INTENT_URL: http://intent:8091/v1
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-mysql,redis,milvus,embedding,intent,guard,localhost,127.0.0.1}
      HF_HOME: /home/app/.cache/huggingface
      TRANSFORMERS_CACHE: /home/app/.cache/huggingface/transformers
      MPLCONFIGDIR: /home/app/.cache/matplotlib
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_ETAG_TIMEOUT: "60"
      NLTK_DATA: /usr/local/share/nltk_data
      AUTO_DOWNLOAD_NLTK: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      embedding:
        condition: service_healthy
      intent:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - hires_cache:/home/app/.cache
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rag
      MYSQL_USER: rag
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请填写 .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请填写 .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u rag -D rag -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  langgraph-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: langgraph
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: ${LANGGRAPH_POSTGRES_PASSWORD:?请填写 .env}
    volumes:
      - langgraph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请填写 .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  # 内置 etcd 在本机 ARM64 环境启动时会在 InitEtcdServer 崩溃；改用独立 etcd，避免 Milvus 随容器反复重启。
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=production-rag-etcd
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=4294967296
    volumes:
      - etcd_data_recovery:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  milvus:
    # MySQL 保存分片原文，Milvus 索引可重建；使用独立 etcd 和新卷，保留原卷作为回滚备份。
    image: milvusdb/milvus:v2.6.25
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "false"
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - milvus_data_external_etcd:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped
  embedding:
    build: ./embedding
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-mysql,redis,milvus,embedding,intent,guard,localhost,127.0.0.1}
    volumes:
      - embedding_cache:/home/embed/.cache
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  intent:
    build: ./intent
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  # 注入检测模型（输入安全检查第三层，app/security_model.py 调用）。默认 Llama Prompt Guard 2 86M：
  # 需要先在 Hugging Face 同意模型许可，并在 .env 里填 HF_TOKEN；第一次启动时下载到 guard_cache 卷。
  # api 不等它：模型没下载好、加载失败时这一层自动跳过，问答照常。
  guard:
    build: ./guard
    environment:
      PROMPT_GUARD_MODEL: ${PROMPT_GUARD_MODEL:-meta-llama/Llama-Prompt-Guard-2-86M}
      HF_TOKEN: ${HF_TOKEN:-}
      # 连不上 huggingface.co 时在 .env 里把 HF_ENDPOINT 换成镜像（例如 https://hf-mirror.com，带 HF_TOKEN 也能下需要许可的模型）。
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      # 新版 huggingface_hub 默认从 Xet 存储（xethub.hf.co）下载大文件，这个域名镜像不代理，换了 HF_ENDPOINT 也会卡住；
      # 关掉后走普通下载，直连和镜像都能用。
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      # huggingface_hub 默认读超时只有 10 秒，经代理访问 CDN 慢一点就会 Read timed out，调到 60 秒。
      HF_HUB_DOWNLOAD_TIMEOUT: ${HF_HUB_DOWNLOAD_TIMEOUT:-60}
      HF_HUB_ETAG_TIMEOUT: ${HF_HUB_ETAG_TIMEOUT:-30}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-mysql,redis,milvus,embedding,intent,guard,localhost,127.0.0.1}
    volumes:
      - guard_cache:/home/guard/.cache
    expose:
      - "8092"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
volumes:
  guard_cache:
  mysql_data:
  langgraph_postgres_data:
  redis_data:
  etcd_data_recovery:
    name: production-rag_etcd_data_recovery
  milvus_data:
  milvus_data_external_etcd:
    name: production-rag_milvus_data_external_etcd
  uploads_data:
  hires_cache:
  embedding_cache:
