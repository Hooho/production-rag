# Alembic 配置。数据库地址不写在这里，由 migrations/env.py 读取与应用相同的 MYSQL_* 环境变量。
[alembic]
script_location = %(here)s/migrations
# 迁移文件名以编号开头（如 0002_add_phone.py），按顺序排列更容易看。
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
